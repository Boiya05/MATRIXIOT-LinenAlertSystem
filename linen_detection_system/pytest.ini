[pytest]
# Put this directory on sys.path so tests can do `from hardware import ...`.
#
# Without this, a bare `pytest tests/` fails with "No module named
# 'hardware'" - only `python -m pytest` happens to work, because that
# form adds the current directory to sys.path and the bare `pytest`
# executable does not. Setting it here means both invocations work,
# from this directory or from the repo root.
pythonpath = .
testpaths = tests
